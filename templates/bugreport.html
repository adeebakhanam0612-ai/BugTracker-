<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BugTracker - Report a Bug</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body class="dashboard-body">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">🐛 BugTracker</span>
    <div>
      <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
      <a href="/" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="form-box mx-auto">
      <h4 class="mb-4">🐛 Report a New Bug</h4>

      <form method="POST" action="/submit_bug">
        <div class="mb-3">
          <label>Bug Title</label>
          <input type="text" name="title" class="form-control" placeholder="Enter bug title"/>
        </div>

        <div class="mb-3">
          <label>Project Name</label>
          <input type="text" name="project" class="form-control" placeholder="Enter project name"/>
        </div>

        <div class="mb-3">
          <label>Description</label>
          <textarea name="description" class="form-control" rows="4" placeholder="Describe the bug in detail..."></textarea>
        </div>

        <div class="mb-3">
          <label>Severity</label>
          <select name="severity" class="form-control">
            <option value="">-- Select Severity --</option>
            <option value="High">🔴 High</option>
            <option value="Medium">🟡 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Assign To (Developer)</label>
          <select name="assigned_to" class="form-control">
            <option value="">-- Select Developer --</option>
            <option value="Sara">Sara</option>
            <option value="Adeeba">Adeeba</option>
            <option value="Juvairiya">Juvairiya</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Reported Date</label>
          <input type="date" name="date_reported" class="form-control"/>
        </div>

        <button type="submit" class="btn btn-danger w-100">Submit Bug Report</button>
      </form>

    </div>
  </div>

</body>
</html>
